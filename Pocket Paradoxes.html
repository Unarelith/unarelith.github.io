<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Pocket Paradoxes</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { margin: 0; width: 100%; height: 100%; background: black; color: #e8e8e8; overflow: hidden; }
		#game-shell {
			position: relative; isolation: isolate;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			width: 100%; height: 100vh; height: 100dvh; background: black; overflow: hidden;
		}
		#canvas {
			position: relative; z-index: 0; display: block; flex: 0 0 auto;
			border: 0; image-rendering: pixelated; touch-action: none;
		}
		#canvas:focus { outline: none; }
		#mobile-controller { display: none; }
		#status {
			position: fixed; inset: 0; z-index: 10; display: flex;
			flex-direction: column; align-items: center; justify-content: center;
			background: black; font: 16px/1.4 sans-serif;
		}
		#status-progress { width: min(50%, 400px); }
		#status-notice { max-width: 40em; padding: 24px; white-space: pre-line; }
		@media (hover: none) and (pointer: coarse) {
			#game-shell { justify-content: flex-start; padding-top: env(safe-area-inset-top); }
			#mobile-controller {
				position: relative; z-index: 2; flex: 0 0 auto;
				display: grid; grid-template-columns: 156px minmax(56px, 1fr) 72px;
				align-items: center; gap: clamp(4px, 2vw, 16px);
				width: min(100%, 520px); min-height: 202px;
				padding: 32px max(8px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
				background: transparent; user-select: none; -webkit-user-select: none;
				-webkit-touch-callout: none; touch-action: none; pointer-events: auto;
			}
			.d-pad { display: grid; grid-template: repeat(3, 52px) / repeat(3, 52px); }
			.control-button {
				margin: 0; padding: 0; border: 2px solid rgba(168, 168, 168, .5);
				color: rgba(232, 232, 232, .8); background: rgba(128, 128, 128, .35);
				font: 700 20px/1 monospace; touch-action: none; -webkit-tap-highlight-color: transparent;
			}
			.control-button.pressed { color: #202020; background: rgba(232, 232, 232, .7); }
			.d-pad .control-button { border-radius: 5px; }
			.d-pad-up { grid-area: 1 / 2; }
			.d-pad-left { grid-area: 2 / 1; }
			.d-pad-right { grid-area: 2 / 3; }
			.d-pad-down { grid-area: 3 / 2; }
			.d-pad::after { content: ""; grid-area: 2 / 2; border-radius: 3px; background: rgba(128, 128, 128, .25); }
			.start-button { justify-self: center; width: 56px; height: 28px; transform: translateY(-24px); border-radius: 999px; font-size: 11px; letter-spacing: 1px; }
			.a-button { width: 72px; height: 72px; border-radius: 50%; font-size: 24px; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="Pocket Paradoxes.icon.png" />
<link rel="apple-touch-icon" href="Pocket Paradoxes.apple-touch-icon.png"/>

</head>
<body>
	<main id="game-shell">
		<canvas id="canvas" width="960" height="864" tabindex="0" aria-label="Pocket Paradoxes game">Your browser does not support canvas.</canvas>
		<div id="mobile-controller" aria-label="Game controls">
			<div class="d-pad" aria-label="Direction pad">
				<button class="control-button d-pad-up" type="button" data-key="ArrowUp" data-key-code="38" data-repeat aria-label="Up">&#9650;</button>
				<button class="control-button d-pad-left" type="button" data-key="ArrowLeft" data-key-code="37" data-repeat aria-label="Left">&#9664;</button>
				<button class="control-button d-pad-right" type="button" data-key="ArrowRight" data-key-code="39" data-repeat aria-label="Right">&#9654;</button>
				<button class="control-button d-pad-down" type="button" data-key="ArrowDown" data-key-code="40" data-repeat aria-label="Down">&#9660;</button>
			</div>
			<button class="control-button start-button" type="button" data-key="Escape" data-key-code="27" aria-label="Start, pause or back">START</button>
			<button class="control-button a-button" type="button" data-key="Enter" data-key-code="13" aria-label="A, confirm">A</button>
		</div>
	</main>
	<div id="status" role="status">
		<progress id="status-progress" aria-label="Loading game"></progress>
		<div id="status-notice">Loading…</div>
	</div>
	<noscript>JavaScript is required to play.</noscript>
	<script src="Pocket Paradoxes.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Pocket Paradoxes","experimentalVK":false,"fileSizes":{"Pocket Paradoxes.pck":29305100,"Pocket Paradoxes.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(() => {
	const canvas = document.getElementById('canvas');
	const shell = document.getElementById('game-shell');
	const controller = document.getElementById('mobile-controller');
	const mobile = matchMedia('(hover: none) and (pointer: coarse)');
	const status = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const notice = document.getElementById('status-notice');
	const heldControls = new Map();
	let ready = false;

	// Resize policy 0: the page owns CSS and drawing-buffer sizes. Godot uses
	// this same buffer for rendering and for mapping mouse/touch coordinates.
	function resizeCanvas() {
		const topInset = parseFloat(getComputedStyle(shell).paddingTop) || 0;
		const availableHeight = Math.max(1, shell.clientHeight - controller.getBoundingClientRect().height - topInset);
		const fit = Math.min(shell.clientWidth / 160, availableHeight / 144);
		const scale = mobile.matches ? fit : Math.min(6, fit >= 1 ? Math.floor(fit) : fit);
		canvas.style.width = `${160 * scale}px`;
		canvas.style.height = `${144 * scale}px`;
		// Keep the drawing buffer an exact integer multiple of the native game.
		const bufferScale = Math.max(1, Math.ceil(scale * (window.devicePixelRatio || 1)));
		const width = 160 * bufferScale;
		const height = 144 * bufferScale;
		if (canvas.width !== width) canvas.width = width;
		if (canvas.height !== height) canvas.height = height;
	}

	// Include controls in the fullscreen element so they stay visible/clickable.
	window.pocketToggleFullscreen = () => {
		const change = document.fullscreenElement ? document.exitFullscreen() : shell.requestFullscreen?.();
		change?.catch((error) => console.warn('Fullscreen unavailable:', error));
	};
	const resizeObserver = new ResizeObserver(resizeCanvas);
	resizeObserver.observe(shell);
	resizeObserver.observe(controller);
	window.addEventListener('resize', resizeCanvas);
	document.addEventListener('fullscreenchange', resizeCanvas);
	mobile.addEventListener('change', () => { releaseAllControls(); resizeCanvas(); });
	resizeCanvas();

	function sendKey(button, type, repeat = false) {
		const keyCode = Number(button.dataset.keyCode);
		canvas.dispatchEvent(new KeyboardEvent(type, {
			key: button.dataset.key, code: button.dataset.key, keyCode, which: keyCode,
			repeat, bubbles: true, cancelable: true,
		}));
	}

	function releaseControl(button) {
		const held = heldControls.get(button);
		if (!held) return;
		clearTimeout(held.delay);
		clearInterval(held.repeat);
		heldControls.delete(button);
		button.classList.remove('pressed');
		sendKey(button, 'keyup');
	}

	function releaseAllControls() {
		heldControls.forEach((_held, button) => releaseControl(button));
	}

	document.querySelectorAll('.control-button').forEach((button) => {
		button.addEventListener('pointerdown', (event) => {
			event.preventDefault();
			if (!ready || heldControls.has(button) || (event.pointerType === 'mouse' && event.button !== 0)) return;
			button.setPointerCapture(event.pointerId);
			button.classList.add('pressed');
			canvas.focus({ preventScroll: true });
			sendKey(button, 'keydown');
			const held = { pointerId: event.pointerId, delay: 0, repeat: 0 };
			if (button.hasAttribute('data-repeat')) {
				held.delay = setTimeout(() => {
					sendKey(button, 'keydown', true);
					held.repeat = setInterval(() => sendKey(button, 'keydown', true), 130);
				}, 300);
			}
			heldControls.set(button, held);
		});
		['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
			button.addEventListener(type, (event) => {
				if (heldControls.get(button)?.pointerId === event.pointerId) releaseControl(button);
			});
		});
		button.addEventListener('contextmenu', (event) => event.preventDefault());
	});
	window.addEventListener('blur', releaseAllControls);
	document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllControls(); });

	function displayFailure(error) {
		console.error(error);
		progress.hidden = true;
		notice.textContent = error instanceof Error ? error.message : String(error);
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) {
		displayFailure('Missing browser features:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) { progress.value = current; progress.max = total; }
			else { progress.removeAttribute('value'); progress.removeAttribute('max'); }
		},
	}).then(() => {
		resizeCanvas();
		ready = true;
		status.remove();
	}, displayFailure);
})();
	</script>
</body>
</html>
